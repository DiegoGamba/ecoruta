name: ecoruta
description: Reporte ciudadano de puntos críticos de residuos sólidos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  amplify_flutter: ^2.4.0
  amplify_auth_cognito: ^2.4.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  http: ^1.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
