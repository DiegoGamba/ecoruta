name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pruebas y calidad
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Análisis estático
        run: ruff check .

      - name: Análisis de seguridad
        run: bandit -r src/ -ll

      - name: Pruebas
        run: pytest --cov=src --cov-report=term --cov-fail-under=75

      # La demostración local es parte de los entregables: si deja de arrancar o
      # deja de detectar puntos críticos, la construcción debe fallar.
      - name: Demostración local (humo)
        working-directory: ${{ github.workspace }}
        run: |
          python3 demo/local_server.py --port 8123 &
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:8123/" > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:8123/puntos-criticos?lat=4.6578&lon=-74.0835" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['hotspot_count'] >= 1, d; print('puntos criticos detectados:', d['hotspot_count'])"

  infra:
    name: Infraestructura · validación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Validar
        # Sin backend remoto: la validación no necesita estado ni credenciales.
        run: |
          terraform init -backend=false
          terraform validate

  mobile:
    name: App móvil · análisis y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          cache: true

      - run: flutter pub get

      # --no-fatal-infos: las sugerencias de estilo se corrigen, pero no rompen
      # la construcción. Los errores y advertencias reales sí la detienen.
      # Cada hallazgo se republica como anotación para que aparezca señalado
      # sobre el código en el pull request, no enterrado en el log.
      - name: Análisis estático
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          code=$?
          cat analyze.log
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done < analyze.log
          fi
          exit "$code"

      - name: Pruebas
        run: flutter test
