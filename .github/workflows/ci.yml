name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pruebas y calidad
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Análisis estático
        run: ruff check .

      - name: Análisis de seguridad
        run: bandit -r src/ -ll

      - name: Pruebas
        run: pytest --cov=src --cov-report=term --cov-fail-under=75

  infra:
    name: Infraestructura · validación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Validar
        # Sin backend remoto: la validación no necesita estado ni credenciales.
        run: |
          terraform init -backend=false
          terraform validate

  mobile:
    name: App móvil · análisis y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
