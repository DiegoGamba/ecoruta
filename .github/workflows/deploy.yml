name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: GitHub asume un rol de AWS por identidad federada.
# No hay llaves de acceso de larga vida almacenadas en el repositorio.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Aplicar infraestructura (dev)
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=ecoruta/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -out=tfplan -var="stage=dev"

      - name: Apply
        run: terraform apply -auto-approve tfplan
